# Copy to .vimcrew/review-gate.yml after copying rules/ to .vimcrew/rules/.
# Requires a Review Gate engine with project-rules support (PR #1148).
mode: block
quorum: 2
max_rules_bytes: 24000
rules: [
  .vimcrew/rules/base/review-essentials.md,
  .vimcrew/rules/profiles/corporate.md,
  .vimcrew/rules/stacks/kotlin-spring-postgres-ddd-hexagonal.md
]
reviewers:
  - {id: claude, vendor: anthropic, model: claude-opus-5-5}
  - {id: gpt, vendor: openai, model: gpt-6.1-sol}
