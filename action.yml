name: VimCrew Review Gate
description: Cross-vendor AI review quorum for pull requests (Claude, GPT, GLM, Kimi, MiniMax, DeepSeek, Qwen) with your own API keys; the verdict is the job's exit code.
author: VimCrew
branding:
  icon: shield
  color: purple
inputs:
  mode:
    description: "block | comment; empty — taken from the config file"
    required: false
    default: ""
  config:
    description: Config path relative to GITHUB_WORKSPACE
    required: false
    default: .vimcrew/review-gate.yml
  anthropic-api-key:
    description: Anthropic key (secrets.ANTHROPIC_API_KEY)
    required: false
    default: ""
  openai-api-key:
    description: OpenAI key (secrets.OPENAI_API_KEY)
    required: false
    default: ""
  zai-api-key:
    description: Z.ai / GLM key (secrets.ZAI_API_KEY)
    required: false
    default: ""
  moonshot-api-key:
    description: Kimi / Moonshot key (secrets.MOONSHOT_API_KEY)
    required: false
    default: ""
  minimax-api-key:
    description: MiniMax key (secrets.MINIMAX_API_KEY)
    required: false
    default: ""
  deepseek-api-key:
    description: DeepSeek key (secrets.DEEPSEEK_API_KEY)
    required: false
    default: ""
  dashscope-api-key:
    description: Qwen / DashScope key (secrets.DASHSCOPE_API_KEY)
    required: false
    default: ""
  github-token:
    description: "Token for reading the PR and posting comments (pull-requests: write)"
    required: false
    default: ${{ github.token }}
outputs:
  report:
    description: Path to review-gate-report.json (run metrics, schema 1)
    value: ${{ steps.run.outputs.report }}
runs:
  using: composite
  steps:
    - name: Run review-gate
      id: run
      shell: bash
      # Inputs reach the script ONLY through env: `${{ }}` expanded inside `run:` is a
      # command-injection path. The image is pinned by digest (immutable): the release
      # script substitutes it, and an unsubstituted placeholder fails the step below.
      env:
        RG_IMAGE: ghcr.io/vimcrew/review-gate@sha256:48cca9cb8170bf59250676d3789fd38a7b4482c7e2ff3573f7a9fed4234a0648
        RG_MODE: ${{ inputs.mode }}
        RG_CONFIG: ${{ inputs.config }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        MOONSHOT_API_KEY: ${{ inputs.moonshot-api-key }}
        MINIMAX_API_KEY: ${{ inputs.minimax-api-key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek-api-key }}
        DASHSCOPE_API_KEY: ${{ inputs.dashscope-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        case "${RG_IMAGE}" in
          *__REVIEW_GATE_IMAGE_DIGEST__*)
            echo "::error::review-gate: image digest placeholder was not substituted — this is not a released build of the action"
            exit 3 ;;
        esac
        # Pull with a few retries: a transient registry hiccup must not turn into a red required check.
        pulled=0
        for attempt in 1 2 3; do
          if docker pull --quiet "${RG_IMAGE}" >/dev/null; then pulled=1; break; fi
          echo "::warning::review-gate: image pull failed (attempt ${attempt}/3)"
          sleep $((attempt * 5))
        done
        if [ "${pulled}" != 1 ]; then
          echo "::error::review-gate: could not pull ${RG_IMAGE}"
          exit 2
        fi
        args=(run --config "/github/workspace/${RG_CONFIG}" --report-file /github/report/review-gate-report.json)
        if [ -n "${RG_MODE}" ]; then args+=(--mode "${RG_MODE}"); fi
        # The workspace is mounted read-only, so the metrics record goes to RUNNER_TEMP.
        echo "report=${RUNNER_TEMP}/review-gate-report.json" >> "${GITHUB_OUTPUT}"
        # Only the listed variables enter the container; the workspace is mounted read-only.
        docker run --rm \
          -e ANTHROPIC_API_KEY -e OPENAI_API_KEY -e ZAI_API_KEY -e MOONSHOT_API_KEY -e MINIMAX_API_KEY \
          -e DEEPSEEK_API_KEY -e DASHSCOPE_API_KEY -e GH_TOKEN -e GITHUB_REPOSITORY -e GITHUB_EVENT_NAME \
          -e GITHUB_EVENT_PATH=/github/event.json -v "${GITHUB_EVENT_PATH}:/github/event.json:ro" \
          -e GITHUB_STEP_SUMMARY=/github/step_summary -v "${GITHUB_STEP_SUMMARY}:/github/step_summary" \
          -v "${GITHUB_WORKSPACE}:/github/workspace:ro" -w /github/workspace \
          -v "${RUNNER_TEMP}:/github/report" \
          "${RG_IMAGE}" "${args[@]}"
